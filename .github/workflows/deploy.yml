# Builds the site and publishes it to the Cloudflare Pages project that
# serves gerfaut-wallet.com.
#
# Run by hand for now: the site goes live the day the first release does,
# not the day this file lands. Switch the trigger to `push` on `main`
# once that day has passed.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy

on: workflow_dispatch

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gerfaut-web --branch=main
